<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e2430; }
      .card { fill: #272f3d; stroke: #3b465a; stroke-width: 1.5; }
      .title { fill: #4fc3f7; font-family: system-ui, sans-serif; font-size: 15px; font-weight: bold; text-anchor: middle; }
      .txt { fill: #cfd8dc; font-family: system-ui, sans-serif; font-size: 12px; }
      .big { fill: #ffffff; font-family: monospace; font-size: 15px; font-weight: bold; }
      .arm { fill: #546e7a; stroke: #90a4ae; stroke-width: 1.5; }
      .hub { fill: #37474f; stroke: #4fc3f7; stroke-width: 2; }
      .force { stroke: #ff5252; stroke-width: 3; fill: none; }
      .rdim { stroke: #ffd54f; stroke-width: 1.5; stroke-dasharray: 5,4; }
      .bar-need { fill: #ff8a65; }
      .bar-have { fill: #00e676; }
      .bar-res { fill: none; stroke: #ffb703; stroke-width: 2; stroke-dasharray: 4,3; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff5252"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" class="bg" rx="10"/>
  <text x="350" y="30" class="title">Uygulama Yükü: Redüktör bu yükü çekebilir mi?</text>
  <rect x="20" y="48" width="330" height="236" rx="8" class="card"/>
  <circle cx="80" cy="170" r="30" class="hub"/>
  <circle cx="80" cy="170" r="8" fill="#4fc3f7"/>
  <rect x="80" y="160" width="230" height="20" rx="10" class="arm"/>
  <circle cx="300" cy="170" r="5" fill="#1e2430"/>
  <line x1="300" y1="170" x2="300" y2="96" class="force" marker-end="url(#ah)"/>
  <text x="308" y="112" class="big" fill="#ff5252">F</text>
  <line x1="80" y1="212" x2="300" y2="212" class="rdim"/>
  <text x="168" y="230" class="big" fill="#ffd54f">r</text>
  <text x="36" y="76" class="txt">10 kg × 9.81 = 98 N kuvvet,</text>
  <text x="36" y="94" class="txt">r = 290 mm (kol boyu / makara yarıçapı)</text>
  <text x="36" y="268" class="big">T = F × r = 98 N × 0.29 m = 28.4 Nm</text>
  <rect x="362" y="48" width="318" height="236" rx="8" class="card"/>
  <text x="378" y="76" class="txt">Gereken tork (yük)</text>
  <rect x="378" y="84" width="170" height="22" rx="4" class="bar-need"/>
  <text x="556" y="100" class="big" fill="#ff8a65">28.4 Nm</text>
  <text x="378" y="132" class="txt">Önerilen (step motor ×1.5 rezerv)</text>
  <rect x="378" y="140" width="255" height="22" rx="4" class="bar-res"/>
  <text x="625" y="156" class="big" fill="#ffb703" text-anchor="end">42.7 Nm</text>
  <text x="378" y="188" class="txt">Redüktörün verdiği: motor × oran × verim</text>
  <rect x="378" y="196" width="95" height="22" rx="4" class="bar-have"/>
  <text x="481" y="212" class="big" fill="#00e676">15.8 Nm</text>
  <text x="378" y="246" class="txt">✓ Uygun ≥ ×1.5 · ⚠ Sınırda · ✗ Uygun değil &lt; ×1</text>
  <text x="378" y="266" class="txt">+ dişli dayanımı, çıkış rulmanı ve mil yan yükü</text>
</svg>
