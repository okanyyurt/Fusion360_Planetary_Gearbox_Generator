  <rect x="348.0" y="154.0" width="24.0" height="46.0" rx="2" class="sun"/>
  <rect x="318.5" y="146.0" width="5.0" height="62.0" rx="1" class="fixed"/>
  <rect x="396.5" y="146.0" width="5.0" height="62.0" rx="1" class="fixed"/>
  <rect x="306.0" y="142.0" width="108.0" height="7.0" rx="2" class="fixed"/>
  <rect x="306.0" y="206.0" width="108.0" height="7.0" rx="2" class="fixed"/>
  <rect x="280.0" y="218.0" width="160.0" height="8.0" rx="2" class="fixed"/>
  <rect x="330.0" y="228.0" width="60.0" height="26.0" rx="2" class="motor"/>
  <text x="360.0" y="245.0" class="lbl" text-anchor="middle">motor</text>
  <path d="M338.0,260.0 A22.0,8.4 0 0 0 382.0,260.0" class="arr-in" marker-end="url(#ain)"/>
  <path d="M418.0,114.0 A58.0,22.0 0 0 1 302.0,114.0" class="arr-out" marker-end="url(#aout)"/>
  <text x="360.0" y="100.0" class="small">tambur döner (ters yön)</text>
  <text x="360.0" y="302.0" class="formula">i = Zr/Zs · ters yön</text>
  <text x="360.0" y="319.0" class="txt">taşıyıcı sabit · tekerlek, vinç,</text>
  <text x="360.0" y="333.0" class="txt">döner tabla, kapı kolu</text>
  <rect x="480.0" y="50.0" width="226.0" height="300.0" rx="8" class="card"/>
  <text x="593.0" y="72.0" class="ptitle">Hız artırıcı (jeneratör)</text>
  <rect x="523.0" y="140.0" width="14.0" height="76.0" rx="2" class="fixed"/>
  <rect x="649.0" y="140.0" width="14.0" height="76.0" rx="2" class="fixed"/>
  <rect x="541.0" y="158.0" width="26.0" height="38.0" rx="2" class="planet"/>
  <rect x="619.0" y="158.0" width="26.0" height="38.0" rx="2" class="planet"/>
  <rect x="581.0" y="154.0" width="24.0" height="46.0" rx="2" class="sun"/>
  <rect x="551.5" y="146.0" width="5.0" height="62.0" rx="1" class="turn"/>
