  <rect x="586.0" y="98.0" width="14.0" height="44.0" rx="2" class="turn"/>
  <rect x="513.0" y="218.0" width="160.0" height="8.0" rx="2" class="fixed"/>
  <rect x="563.0" y="228.0" width="60.0" height="26.0" rx="2" class="motor"/>
  <text x="593.0" y="245.0" class="lbl" text-anchor="middle">jeneratör</text>
  <path d="M567.0,104.0 A26.0,9.9 0 0 0 619.0,104.0" class="arr-in" marker-end="url(#ain)"/>
  <text x="593.0" y="90.0" class="small">krank / türbin (giriş)</text>
  <path d="M571.0,260.0 A22.0,8.4 0 0 0 615.0,260.0" class="arr-out" marker-end="url(#aout)"/>
  <text x="593.0" y="302.0" class="formula">n_jen = n_giriş × i</text>
  <text x="593.0" y="319.0" class="txt">çıkıştan döndürülür · rüzgâr,</text>
  <text x="593.0" y="333.0" class="txt">el krankı ile şarj</text>
  <rect x="220.0" y="351.0" width="14.0" height="10.0" rx="1" class="fixed"/>
  <text x="240" y="360" class="lbl">sabit</text>
  <rect x="290.0" y="351.0" width="14.0" height="10.0" rx="1" class="turn"/>
  <text x="310" y="360" class="lbl">döner</text>
  <line x1="362" y1="356" x2="384" y2="356" class="arr-in" marker-end="url(#ain)"/>
  <text x="390" y="360" class="lbl">giriş</text>
  <line x1="430" y1="356" x2="452" y2="356" class="arr-out" marker-end="url(#aout)"/>
  <text x="458" y="360" class="lbl">çıkış</text>
</svg>
