  <text x="127.0" y="319.0" class="txt">gövde sabit · mil / flanş / kol</text>
  <text x="127.0" y="333.0" class="txt">en yüksek oran, en küçük</text>
  <rect x="247.0" y="50.0" width="226.0" height="300.0" rx="8" class="card"/>
