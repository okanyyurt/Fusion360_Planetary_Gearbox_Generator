<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e2430; }
      .card { fill: #272f3d; stroke: #3b465a; stroke-width: 1.5; }
      .title { fill: #4fc3f7; font-family: system-ui, sans-serif; font-size: 15px; font-weight: bold; text-anchor: middle; }
      .ptitle { fill: #ffffff; font-family: system-ui, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .txt { fill: #cfd8dc; font-family: system-ui, sans-serif; font-size: 11px; text-anchor: middle; }
      .small { fill: #90a4ae; font-family: system-ui, sans-serif; font-size: 10px; text-anchor: middle; }
      .formula { fill: #ffd54f; font-family: monospace; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .fixed { fill: url(#hatch); stroke: #78909c; stroke-width: 1.2; }
      .turn { fill: #0288d1; stroke: #4fc3f7; stroke-width: 1.4; }
      .sun { fill: #d8a945; stroke: #ffe082; stroke-width: 1.2; }
      .planet { fill: #8fa3b8; stroke: #cfd8dc; stroke-width: 1.2; }
      .motor { fill: #37474f; stroke: #90a4ae; stroke-width: 1.2; }
      .lbl { fill: #e0e0e0; font-family: system-ui, sans-serif; font-size: 10px; }
      .arr-in { stroke: #00e676; stroke-width: 2.4; fill: none; }
      .arr-out { stroke: #ff8a65; stroke-width: 2.4; fill: none; }
    </style>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#455a64"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#78909c" stroke-width="1.6"/>
    </pattern>
    <marker id="ain" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#00e676"/>
    </marker>
    <marker id="aout" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff8a65"/>
    </marker>
  </defs>
    <rect width="100%" height="100%" class="bg" rx="10"/>
  <text x="360.0" y="30.0" class="title">Redüktör Düzeni: hangi eleman sabit, hangisi döner?</text>
