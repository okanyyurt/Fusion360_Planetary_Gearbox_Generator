<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1a1e29; }
      .card { fill: #242a38; stroke: #3a4457; stroke-width: 1.5; rx: 8; }
      .title { fill: #4fc3f7; font-family: system-ui, sans-serif; font-size: 15px; font-weight: bold; text-anchor: middle; }
      .subtitle { fill: #81c784; font-family: system-ui, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .bad { fill: #e57373; font-family: system-ui, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc { fill: #cfd8dc; font-family: system-ui, sans-serif; font-size: 11px; text-anchor: middle; }
      .gear-body { fill: #37474f; stroke: #78909c; stroke-width: 2; }
      .tooth-line { stroke: #ffd54f; stroke-width: 3; stroke-linecap: round; }
      .force-arrow { stroke: #ff5252; stroke-width: 3; marker-end: url(#arrowhead); fill: none; }
      .balance-arrow { stroke: #69f0ae; stroke-width: 3; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#ff5252" />
    </marker>
    <marker id="arrowgreen" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#69f0ae" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="10"/>

  <!-- Panel 1: SPUR GEAR (Düz Dişli) -->
  <rect x="20" y="20" width="210" height="280" class="card"/>
  <text x="125" y="48" class="title">1. Düz Dişli (Spur)</text>
  <rect x="75" y="75" width="100" height="110" class="gear-body" rx="4"/>
  <!-- Straight Teeth -->
  <line x1="90" y1="85" x2="90" y2="175" class="tooth-line"/>
  <line x1="110" y1="85" x2="110" y2="175" class="tooth-line"/>
  <line x1="130" y1="85" x2="130" y2="175" class="tooth-line"/>
  <line x1="150" y1="85" x2="150" y2="175" class="tooth-line"/>
  <text x="125" y="215" class="subtitle">Eksenel Kuvvet: 0</text>
  <text x="125" y="245" class="desc">• İmalatı en kolay</text>
  <text x="125" y="265" class="desc">• Yüksek devirde sesli</text>
  <text x="125" y="285" class="desc">• Düşük temas oranı (ε ≈ 1.2)</text>

  <!-- Panel 2: HELICAL GEAR (Tek Helis) -->
  <rect x="255" y="20" width="210" height="280" class="card"/>
  <text x="360" y="48" class="title">2. Helisel Dişli (Helical)</text>
  <rect x="310" y="75" width="100" height="110" class="gear-body" rx="4"/>
  <!-- Angled Teeth -->
  <line x1="320" y1="175" x2="350" y2="85" class="tooth-line"/>
  <line x1="345" y1="175" x2="375" y2="85" class="tooth-line"/>
  <line x1="370" y1="175" x2="400" y2="85" class="tooth-line"/>
  <!-- Axial force arrow -->
  <line x1="360" y1="130" x2="360" y2="60" stroke="#ff5252" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="400" y="75" fill="#ff5252" font-size="11px" font-weight="bold">F_axial</text>
  <text x="360" y="215" class="bad">⚠️ Eksenel İtme Vardır</text>
  <text x="360" y="245" class="desc">• Sessiz ve yüksek tork</text>
  <text x="360" y="265" class="desc">• Rulmanlara eksenel yük bindirir</text>
  <text x="360" y="285" class="desc">• Taşıyıcıyı kastırabilir</text>

  <!-- Panel 3: HERRINGBONE (Balıksırtı / Çavuş) -->
  <rect x="490" y="20" width="210" height="280" class="card" stroke="#64b5f6" stroke-width="2"/>
  <text x="595" y="48" class="title" fill="#ffd54f">★ 3. Balıksırtı (Herringbone)</text>
  <rect x="545" y="75" width="100" height="110" class="gear-body" rx="4"/>
  <!-- V-shaped Teeth -->
  <path d="M 555 175 L 570 130 L 555 85" fill="none" class="tooth-line"/>
  <path d="M 580 175 L 595 130 L 580 85" fill="none" class="tooth-line"/>
  <path d="M 605 175 L 620 130 L 605 85" fill="none" class="tooth-line"/>
  <path d="M 630 175 L 645 130 L 630 85" fill="none" class="tooth-line"/>
  <!-- Opposing zero forces -->
  <line x1="595" y1="125" x2="595" y2="90" stroke="#69f0ae" stroke-width="2.5" marker-end="url(#arrowgreen)"/>
  <line x1="595" y1="135" x2="595" y2="170" stroke="#69f0ae" stroke-width="2.5" marker-end="url(#arrowgreen)"/>
  <text x="595" y="215" class="subtitle">✓ Net Eksenel Kuvvet: 0</text>
  <text x="595" y="245" class="desc">• Zıt açılar birbirini dengeler</text>
  <text x="595" y="265" class="desc">• Maksimum tork ve temas (ε > 2.0)</text>
  <text x="595" y="285" class="desc">• 3D Baskı için en stabil çözüm!</text>
</svg>
