<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e2430; }
      .card { fill: #272f3d; stroke: #3b465a; stroke-width: 1.5; rx: 8; }
      .title { fill: #64b5f6; font-family: system-ui, sans-serif; font-size: 15px; font-weight: bold; text-anchor: middle; }
      .desc { fill: #cfd8dc; font-family: system-ui, sans-serif; font-size: 11px; }
      .stg1 { fill: #3f51b5; stroke: #7986cb; stroke-width: 2; }
      .stg2 { fill: #00897b; stroke: #4db6ac; stroke-width: 2; }
      .carrier { fill: #546e7a; stroke: #90a4ae; stroke-width: 2; }
      .sun { fill: #ffa000; stroke: #ffd54f; stroke-width: 2; }
      .label { fill: #ffffff; font-family: system-ui, sans-serif; font-size: 11px; font-weight: bold; text-anchor: middle; }
      .arrow { stroke: #00e676; stroke-width: 2.5; marker-end: url(#arrowgreen); fill: none; }
    </style>
    <marker id="arrowgreen" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#00e676" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="10"/>

  <text x="350" y="32" class="title">Çok Kademeli (Multi-Stage) Planet Güç Aktarımı</text>

  <!-- Motor Shaft Input -->
  <rect x="25" y="125" width="60" height="30" fill="#e53935" stroke="#ff8a80" stroke-width="2"/>
  <text x="55" y="144" class="label">Motor</text>

  <!-- Stage 1 Sun -->
  <rect x="95" y="105" width="40" height="70" class="sun"/>
  <text x="115" y="144" class="label">Güneş 1</text>

  <!-- Stage 1 Planets -->
  <rect x="145" y="55" width="45" height="50" class="stg1"/>
  <rect x="145" y="175" width="45" height="50" class="stg1"/>
  <text x="167" y="85" class="label">Planet 1</text>
  <text x="167" y="205" class="label">Planet 1</text>

  <!-- Stage 1 Carrier Hub connecting directly to Stage 2 Sun! -->
  <rect x="200" y="65" width="25" height="150" class="carrier"/>
  <text x="212" y="144" class="label" transform="rotate(-90 212 144)">1. Kademe Taşıyıcı</text>

  <!-- Connection Neck -->
  <rect x="235" y="125" width="45" height="30" class="carrier" stroke="#00e676" stroke-width="2"/>
  <text x="257" y="144" class="label" fill="#00e676">Kuplaj</text>

  <!-- Stage 2 Sun (Driven directly by Carrier 1) -->
  <rect x="290" y="110" width="45" height="60" class="sun"/>
  <text x="312" y="144" class="label">Güneş 2</text>

  <!-- Stage 2 Planets -->
  <rect x="345" y="55" width="55" height="50" class="stg2"/>
  <rect x="345" y="175" width="55" height="50" class="stg2"/>
  <text x="372" y="85" class="label">Planet 2</text>
  <text x="372" y="205" class="label">Planet 2</text>

  <!-- Stage 2 Carrier (Final Output) -->
  <rect x="410" y="65" width="25" height="150" class="carrier"/>
  <text x="422" y="144" class="label" transform="rotate(-90 422 144)">2. Kademe Taşıyıcı</text>

  <!-- Gearbox Output Shaft -->
  <rect x="445" y="120" width="85" height="40" fill="#00e676" stroke="#b9f6ca" stroke-width="2"/>
  <text x="487" y="145" class="label" fill="#000">ÇIKIŞ ŞAFTI</text>

  <!-- Explanatory note -->
  <rect x="545" y="60" width="135" height="180" class="card"/>
  <text x="612" y="85" fill="#4fc3f7" font-weight="bold" font-size="12px" text-anchor="middle">Toplam Oran</text>
  <text x="612" y="115" class="label" font-size="14px">R_tot = R1 × R2</text>
  <text x="555" y="150" class="desc">• 1. Kademe Taşıyıcısı</text>
  <text x="555" y="170" class="desc">  2. Kademe Güneşini</text>
  <text x="555" y="190" class="desc">  doğrudan döndürür.</text>
  <text x="555" y="215" class="desc">• Ortak dış gövde</text>
  <text x="555" y="230" class="desc">  çember dişliyi paylaşır.</text>
</svg>
