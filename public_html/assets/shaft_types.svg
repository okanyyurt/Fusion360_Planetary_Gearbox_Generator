<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e2430; }
      .card { fill: #272f3d; stroke: #3b465a; stroke-width: 1.5; rx: 8; }
      .title { fill: #64b5f6; font-family: system-ui, sans-serif; font-size: 15px; font-weight: bold; text-anchor: middle; }
      .desc { fill: #b0bec5; font-family: system-ui, sans-serif; font-size: 11px; text-anchor: middle; }
      .metal { fill: #cfd8dc; stroke: #90a4ae; stroke-width: 2; }
      .dim { stroke: #ff7043; stroke-width: 1.5; stroke-dasharray: 3,3; }
      .dim-text { fill: #ff7043; font-family: monospace; font-size: 11px; font-weight: bold; text-anchor: middle; }
      .center-mark { stroke: #4fc3f7; stroke-width: 1; stroke-dasharray: 2,2; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="10"/>

  <!-- Card 1: ROUND SHAFT -->
  <rect x="20" y="20" width="150" height="280" class="card"/>
  <text x="95" y="48" class="title">1. Yuvarlak Şaft</text>
  <circle cx="95" cy="140" r="45" class="metal"/>
  <line x1="95" y1="85" x2="95" y2="195" class="center-mark"/>
  <line x1="40" y1="140" x2="150" y2="140" class="center-mark"/>
  <!-- Dimension -->
  <line x1="50" y1="195" x2="140" y2="195" class="dim"/>
  <text x="95" y="215" class="dim-text">Ø d_motor</text>
  <text x="95" y="255" class="desc">Pres-geçme veya</text>
  <text x="95" y="272" class="desc">setskur vidalı</text>

  <!-- Card 2: D-CUT SHAFT -->
  <rect x="185" y="20" width="150" height="280" class="card"/>
  <text x="260" y="48" class="title">2. D-Şaft (Tek Düz)</text>
  <!-- D shaft path -->
  <path d="M 228 105 A 45 45 0 1 0 292 105 Z" class="metal"/>
  <line x1="228" y1="105" x2="292" y2="105" stroke="#ef5350" stroke-width="2.5"/>
  <line x1="260" y1="85" x2="260" y2="195" class="center-mark"/>
  <!-- Dimension -->
  <line x1="295" y1="95" x2="295" y2="105" class="dim"/>
  <text x="260" y="215" class="dim-text">Flat Derinliği (h)</text>
  <text x="260" y="255" class="desc">NEMA 17/23 için</text>
  <text x="260" y="272" class="desc">kaymayı önler</text>

  <!-- Card 3: DOUBLE D-CUT -->
  <rect x="350" y="20" width="150" height="280" class="card"/>
  <text x="425" y="48" class="title">3. Çift D-Şaft</text>
  <path d="M 393 105 A 45 45 0 0 0 457 105 L 457 175 A 45 45 0 0 0 393 175 Z" class="metal"/>
  <line x1="393" y1="105" x2="457" y2="105" stroke="#ef5350" stroke-width="2"/>
  <line x1="393" y1="175" x2="457" y2="175" stroke="#ef5350" stroke-width="2"/>
  <text x="425" y="215" class="dim-text">Simetrik Düzlük</text>
  <text x="425" y="255" class="desc">Yüksek torklu BLDC</text>
  <text x="425" y="272" class="desc">ve RC motorlar</text>

  <!-- Card 4: KEYWAY (DIN 6885) -->
  <rect x="515" y="20" width="165" height="280" class="card"/>
  <text x="597" y="48" class="title">4. Kamalı Şaft</text>
  <path d="M 587 96 L 587 85 L 607 85 L 607 96 A 45 45 0 1 1 587 96 Z" class="metal"/>
  <rect x="587" y="85" width="20" height="15" fill="none" stroke="#26a69a" stroke-width="2"/>
  <text x="597" y="215" class="dim-text">Genişlik x Yükseklik</text>
  <text x="597" y="255" class="desc">NEMA 34 ve Endüstriyel</text>
  <text x="597" y="272" class="desc">Ağır hizmet motorları</text>
</svg>
